<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 트렌드 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- only the intro reel uses these fonts: load without blocking the page (play() waits for it) -->
<link rel="stylesheet" id="reel-fonts" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e4e0; --accent: #2f6fed; --accent-soft: #e8f0fe; --up: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #ececee; --muted: #9a9aa0;
      --line: #2e2e33; --accent: #7aa7ff; --accent-soft: #1f2a44; --up: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 20px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  ol { list-style: none; margin: 0; padding: 0; }
  li.row { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  li.row:first-child { border-top: 0; }
  .rank { font-weight: 700; font-size: 1.1rem; color: var(--accent); text-align: center; }
  .kw { min-width: 0; }
  .kw a { color: var(--text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .kw a:hover { text-decoration: underline; }
  .kw .news { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kw .news a { color: var(--muted); font-weight: 400; }
  .traffic { font-size: .8rem; color: var(--up); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  select, a.btn { font: inherit; font-size: .9rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
  .empty { color: var(--muted); padding: 12px 0; }
  .age { white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .num { text-align: right; white-space: nowrap; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 28px; text-align: center; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button.btn { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .reel-video { width: 100%; border-radius: 10px; background: #000; display: block; aspect-ratio: 16 / 9; }

  /* intro reel overlay */
  #intro { position: fixed; inset: 0; z-index: 1000; background: #000; opacity: 1; transition: opacity .6s ease; }
  #intro[hidden] { display: none; }
  #intro.leaving { opacity: 0; pointer-events: none; }
  #intro canvas { width: 100%; height: 100%; display: block; }
  #intro .ui { position: absolute; right: 16px; bottom: 20px; display: flex; gap: 8px; }
  #intro .ui button { font: 500 14px/1 -apple-system, "Malgun Gothic", sans-serif; color: #f3f5fa; background: rgba(20,22,30,.72); border: 1px solid rgba(243,245,250,.25); border-radius: 999px; padding: 10px 16px; cursor: pointer; backdrop-filter: blur(6px); }
  #intro .ui button:hover { background: rgba(40,44,60,.85); }
  #intro .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #1ef2a0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📈 실시간 트렌드 기록</h1>
    <p>구글 트렌드(대한민국) 인기 검색어 1~10위를 자동으로 모아 쌓아 둡니다. (보통 몇 시간 간격)</p>
    <div class="header-actions">
      <button class="btn" id="replay-intro" type="button">▶ 인트로 영상 다시 보기</button>
    </div>
  </header>

  <section class="card">
    <h2>지금 TOP 10 <small id="latest-time">불러오는 중…</small></h2>
    <ol id="latest"></ol>
  </section>

  <section class="card">
    <h2>시간대별 기록</h2>
    <div class="controls">
      <select id="snap-select" aria-label="수집 시각 선택"></select>
      <a class="btn" href="data/history.csv" download>CSV 받기</a>
    </div>
    <ol id="snapshot"></ol>
  </section>

  <section class="card">
    <h2>자주 올라온 키워드 <small>기록 전체 기준</small></h2>
    <table>
      <thead><tr><th>키워드</th><th class="num">등장 횟수</th><th class="num">최고 순위</th></tr></thead>
      <tbody id="ranking"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>MARKET PULSE 쇼릴 <small>15초 · 100% 코드로 제작</small></h2>
    <video class="reel-video" src="reel/market-pulse.mp4" poster="reel/poster.jpg" controls playsinline preload="none"></video>
    <div class="controls" style="margin: 12px 0 0">
      <a class="btn" href="reel/market-pulse.mp4" download>MP4 받기</a>
    </div>
  </section>

  <footer>GitHub Actions가 자동으로 갱신합니다 (매시간 예약, 실제로는 보통 몇 시간 간격) · 데이터 출처: Google Trends</footer>
</main>

<div id="intro" hidden role="dialog" aria-modal="true" aria-label="MARKET PULSE 인트로 영상">
  <canvas aria-hidden="true"></canvas>
  <div class="ui">
    <button type="button" id="intro-sound">🔊 소리 켜기</button>
    <button type="button" id="intro-skip">건너뛰기 ›</button>
  </div>
  <div class="bar"></div>
</div>
<script src="reel/reel.js"></script>

<script>
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

const LOAD_FAILED = "기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.";

// feed links are external data: only ever link http(s) URLs
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
const link = (url, text) => (safeUrl(url)
  ? el("a", { href: url, target: "_blank", rel: "noopener" }, text)
  : document.createTextNode(text));

// "2026-11-03 15:31" is Korea time; say how old it is, since collection is not really hourly
function age(collectedAt) {
  const t = Date.parse(String(collectedAt).replace(" ", "T") + ":00+09:00");
  if (!Number.isFinite(t)) return "";
  const min = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (min < 1) return "방금 전";
  if (min < 60) return min + "분 전";
  if (min < 48 * 60) return Math.floor(min / 60) + "시간 전";
  return Math.floor(min / 1440) + "일 전";
}

function renderList(target, items, emptyText) {
  target.replaceChildren();
  if (!items || !items.length) {
    target.append(el("li", { class: "empty" }, emptyText || "아직 수집된 데이터가 없어요. 첫 자동 수집을 기다리는 중입니다."));
    return;
  }
  for (const it of items) {
    const li = el("li", { class: "row" });
    li.append(el("span", { class: "rank" }, it.rank));
    const kw = el("div", { class: "kw" });
    kw.append(link(it.search_url, it.keyword));
    if (it.news_title) {
      const news = el("span", { class: "news" });
      news.append(link(it.news_url, it.news_title));
      kw.append(news);
    }
    li.append(kw);
    li.append(el("span", { class: "traffic" }, it.traffic ? it.traffic + " 검색" : "-"));
    target.append(li);
  }
}

function renderRanking(history) {
  const tbody = document.getElementById("ranking");
  tbody.replaceChildren();
  const stats = new Map();
  for (const snap of history || []) {
    for (const it of snap.items) {
      const key = String(it.keyword).replace(/\s+/g, "").toLowerCase();  // "앤 트로픽" = "앤트로픽"
      const s = stats.get(key) || { count: 0, best: 99, forms: new Map() };
      s.count += 1;
      s.best = Math.min(s.best, it.rank);
      s.forms.set(it.keyword, (s.forms.get(it.keyword) || 0) + 1);
      stats.set(key, s);
    }
  }
  const top = [...stats.values()].sort((a, b) => b.count - a.count || a.best - b.best).slice(0, 15);
  if (!top.length) {
    const tr = el("tr");
    tr.append(el("td", { colspan: "3", class: "empty" }, history ? "기록이 쌓이면 여기에 표시돼요." : LOAD_FAILED));
    tbody.append(tr);
    return;
  }
  for (const s of top) {
    const kw = [...s.forms.entries()].sort((a, b) => b[1] - a[1])[0][0];
    const tr = el("tr");
    tr.append(el("td", {}, kw), el("td", { class: "num" }, s.count + "회"), el("td", { class: "num" }, s.best + "위"));
    tbody.append(tr);
  }
}

// null = could not load (shown as an error), [] / {} = loaded but nothing collected yet
const getJson = url => fetch(url, { cache: "no-cache" })
  .then(res => (res.ok ? res.json() : res.status === 404 ? undefined : null))
  .catch(() => null);
const historyPromise = getJson("data/history.json").then(h => (h === undefined ? [] : h));
const latestPromise = getJson("data/latest.json")
  .then(l => (l && l.items ? l : historyPromise.then(h => (h ? h[0] || {} : null))));

function renderLatest(latest) {
  const time = document.getElementById("latest-time");
  time.replaceChildren();
  if (latest && latest.collected_at) {
    time.append(latest.collected_at + " (한국시간) · ", el("span", { class: "age" }, age(latest.collected_at)));
  } else {
    time.textContent = latest ? "수집 대기 중" : "불러오기 실패";
  }
  renderList(document.getElementById("latest"), latest && latest.items, latest ? undefined : LOAD_FAILED);
}

async function load() {
  latestPromise.then(renderLatest);
  const history = await historyPromise;

  const select = document.getElementById("snap-select");
  select.replaceChildren();
  (history || []).forEach((snap, i) => select.append(el("option", { value: i }, snap.collected_at)));
  const showSnap = () => renderList(document.getElementById("snapshot"),
    history && history[select.value] && history[select.value].items, history ? undefined : LOAD_FAILED);
  select.onchange = showSnap;
  showSnap();

  renderRanking(history);
}

load();

// ---- intro reel: plays on the first visit (or with #intro), drawn live from reel/reel.js
const intro = (() => {
  const el = document.getElementById("intro");
  const canvas = el.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const bar = el.querySelector(".bar");
  const soundBtn = document.getElementById("intro-sound");
  const skipBtn = document.getElementById("intro-skip");
  const page = document.querySelector("main");
  // active: overlay is up (incl. the short wait for data/fonts); playing: frames are running.
  // run: bumped by every play/finish, so a play() still waiting can tell it was cancelled.
  let start = 0, raf = 0, ac = null, soundOn = false, data = null;
  let active = false, playing = false, run = 0, hideTimer = 0, returnFocus = null;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = innerWidth * dpr, h = innerHeight * dpr;
    const cap = 2560 / Math.max(w, 1);
    if (cap < 1) { w *= cap; h *= cap; }
    canvas.width = Math.round(w); canvas.height = Math.round(h);
  }
  function startSound(offset) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      Reel.buildAudio(ac, ac.currentTime + 0.05, offset + 0.05);
    } catch (e) { ac = null; }
  }
  function stopSound() { if (ac) { ac.close().catch(() => {}); ac = null; } }
  function setSound(on) {
    soundOn = on;
    soundBtn.textContent = on ? "🔇 소리 끄기" : "🔊 소리 켜기";
    stopSound();
    if (on && playing) startSound((performance.now() - start) / 1000);
  }
  function tick(now) {
    const t = (now - start) / 1000;
    Reel.frame(ctx, t, data);
    bar.style.width = Math.min(100, (t / Reel.DURATION) * 100) + "%";
    if (t >= Reel.DURATION) return finish();
    raf = requestAnimationFrame(tick);
  }
  function finish() {
    if (!active) return;
    active = false; playing = false; run++;
    cancelAnimationFrame(raf);
    stopSound();
    el.classList.add("leaving");
    hideTimer = setTimeout(() => { el.hidden = true; el.classList.remove("leaving"); }, 650);
    page.inert = false;
    if (returnFocus && returnFocus.isConnected) returnFocus.focus();
    try { localStorage.setItem("reel-seen", "1"); } catch (e) {}
    if (location.hash === "#intro") history.replaceState(null, "", location.pathname + location.search);
  }
  // resolves once the (non-blocking) font stylesheet has loaded, failed, or taken too long
  function fontCss(ms) {
    const link = document.getElementById("reel-fonts");
    if (!link || link.media === "all") return Promise.resolve();
    return new Promise(r => {
      link.addEventListener("load", r, { once: true });
      link.addEventListener("error", r, { once: true });
      setTimeout(r, ms);
    });
  }
  async function play() {
    if (active || !window.Reel) return;
    active = true;
    const id = ++run;
    clearTimeout(hideTimer);
    el.hidden = false; el.classList.remove("leaving");
    returnFocus = document.activeElement;
    page.inert = true;
    skipBtn.focus();
    size();
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    const snap = await Promise.race([latestPromise, timeout(1500).then(() => null)]);
    if (id !== run) return;  // skipped while waiting
    data = Reel.dataFrom(snap);
    await Promise.race([fontCss(2500).then(() => Reel.loadFonts(2500)), timeout(2500)]);
    if (id !== run) return;
    playing = true;
    start = performance.now();
    if (soundOn) startSound(0);
    raf = requestAnimationFrame(tick);
  }
  soundBtn.onclick = () => setSound(!soundOn);
  skipBtn.onclick = finish;
  document.getElementById("replay-intro").onclick = () => { setSound(true); play(); };
  addEventListener("keydown", e => { if (e.key === "Escape") finish(); });
  addEventListener("resize", () => { if (playing) size(); });
  return { play };
})();

(() => {
  let seen = false;
  try { seen = localStorage.getItem("reel-seen") === "1"; } catch (e) {}
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (location.hash === "#intro" || (!seen && !reduced)) intro.play();
})();
</script>
</body>
</html>
