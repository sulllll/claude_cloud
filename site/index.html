<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 트렌드 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e4e0; --accent: #2f6fed; --accent-soft: #e8f0fe; --up: #d93b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #ececee; --muted: #9a9aa0;
      --line: #2e2e33; --accent: #7aa7ff; --accent-soft: #1f2a44; --up: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 20px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  ol { list-style: none; margin: 0; padding: 0; }
  li.row { display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  li.row:first-child { border-top: 0; }
  .rank { font-weight: 700; font-size: 1.1rem; color: var(--accent); text-align: center; }
  .kw a { color: var(--text); font-weight: 600; text-decoration: none; }
  .kw a:hover { text-decoration: underline; }
  .kw .news { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kw .news a { color: var(--muted); font-weight: 400; }
  .traffic { font-size: .8rem; color: var(--up); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  select, a.btn { font: inherit; font-size: .9rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
  .empty { color: var(--muted); padding: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .num { text-align: right; white-space: nowrap; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 28px; text-align: center; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button.btn { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .reel-video { width: 100%; border-radius: 10px; background: #000; display: block; aspect-ratio: 16 / 9; }

  /* intro reel overlay */
  #intro { position: fixed; inset: 0; z-index: 1000; background: #000; opacity: 1; transition: opacity .6s ease; }
  #intro[hidden] { display: none; }
  #intro.leaving { opacity: 0; pointer-events: none; }
  #intro canvas { width: 100%; height: 100%; display: block; }
  #intro .ui { position: absolute; right: 16px; bottom: 20px; display: flex; gap: 8px; }
  #intro .ui button { font: 500 14px/1 -apple-system, "Malgun Gothic", sans-serif; color: #f3f5fa; background: rgba(20,22,30,.72); border: 1px solid rgba(243,245,250,.25); border-radius: 999px; padding: 10px 16px; cursor: pointer; backdrop-filter: blur(6px); }
  #intro .ui button:hover { background: rgba(40,44,60,.85); }
  #intro .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #1ef2a0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📈 실시간 트렌드 기록</h1>
    <p>구글 트렌드(대한민국) 인기 검색어 1~10위를 매시간 자동으로 모아 쌓아 둡니다.</p>
    <div class="header-actions">
      <button class="btn" id="replay-intro" type="button">▶ 인트로 영상 다시 보기</button>
    </div>
  </header>

  <section class="card">
    <h2>지금 TOP 10 <small id="latest-time">불러오는 중…</small></h2>
    <ol id="latest"></ol>
  </section>

  <section class="card">
    <h2>시간대별 기록</h2>
    <div class="controls">
      <select id="snap-select" aria-label="수집 시각 선택"></select>
      <a class="btn" href="data/history.csv" download>CSV 받기</a>
    </div>
    <ol id="snapshot"></ol>
  </section>

  <section class="card">
    <h2>자주 올라온 키워드 <small>기록 전체 기준</small></h2>
    <table>
      <thead><tr><th>키워드</th><th class="num">등장 횟수</th><th class="num">최고 순위</th></tr></thead>
      <tbody id="ranking"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>MARKET PULSE 쇼릴 <small>15초 · 100% 코드로 제작</small></h2>
    <video class="reel-video" src="reel/market-pulse.mp4" poster="reel/poster.jpg" controls playsinline preload="none"></video>
    <div class="controls" style="margin: 12px 0 0">
      <a class="btn" href="reel/market-pulse.mp4" download>MP4 받기</a>
    </div>
  </section>

  <footer>GitHub Actions가 매시간 자동으로 갱신합니다 · 데이터 출처: Google Trends</footer>
</main>

<div id="intro" hidden>
  <canvas aria-label="MARKET PULSE 인트로 영상"></canvas>
  <div class="ui">
    <button type="button" id="intro-sound">🔊 소리 켜기</button>
    <button type="button" id="intro-skip">건너뛰기 ›</button>
  </div>
  <div class="bar"></div>
</div>
<script src="reel/reel.js"></script>

<script>
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderList(target, items) {
  target.replaceChildren();
  if (!items || !items.length) {
    target.append(el("li", { class: "empty" }, "아직 수집된 데이터가 없어요. 첫 자동 수집을 기다리는 중입니다."));
    return;
  }
  for (const it of items) {
    const li = el("li", { class: "row" });
    li.append(el("span", { class: "rank" }, it.rank));
    const kw = el("div", { class: "kw" });
    kw.append(el("a", { href: it.search_url, target: "_blank", rel: "noopener" }, it.keyword));
    if (it.news_title) {
      const news = el("span", { class: "news" });
      news.append(it.news_url
        ? el("a", { href: it.news_url, target: "_blank", rel: "noopener" }, it.news_title)
        : document.createTextNode(it.news_title));
      kw.append(news);
    }
    li.append(kw);
    li.append(el("span", { class: "traffic" }, it.traffic ? it.traffic + " 검색" : "-"));
    target.append(li);
  }
}

function renderRanking(history) {
  const stats = new Map();
  for (const snap of history) {
    for (const it of snap.items) {
      const s = stats.get(it.keyword) || { count: 0, best: 99 };
      s.count += 1;
      s.best = Math.min(s.best, it.rank);
      stats.set(it.keyword, s);
    }
  }
  const tbody = document.getElementById("ranking");
  tbody.replaceChildren();
  const top = [...stats.entries()].sort((a, b) => b[1].count - a[1].count || a[1].best - b[1].best).slice(0, 15);
  if (!top.length) {
    const tr = el("tr");
    tr.append(el("td", { colspan: "3", class: "empty" }, "기록이 쌓이면 여기에 표시돼요."));
    tbody.append(tr);
    return;
  }
  for (const [kw, s] of top) {
    const tr = el("tr");
    tr.append(el("td", {}, kw), el("td", { class: "num" }, s.count + "회"), el("td", { class: "num" }, s.best + "위"));
    tbody.append(tr);
  }
}

const historyPromise = fetch("data/history.json", { cache: "no-store" })
  .then(res => (res.ok ? res.json() : []))
  .catch(() => []);

async function load() {
  const history = await historyPromise;

  const latest = history[0];
  document.getElementById("latest-time").textContent = latest ? latest.collected_at + " (한국시간)" : "수집 대기 중";
  renderList(document.getElementById("latest"), latest && latest.items);

  const select = document.getElementById("snap-select");
  select.replaceChildren();
  history.forEach((snap, i) => select.append(el("option", { value: i }, snap.collected_at)));
  const showSnap = () => renderList(document.getElementById("snapshot"), history[select.value] && history[select.value].items);
  select.onchange = showSnap;
  showSnap();

  renderRanking(history);
}

load();

// ---- intro reel: plays on the first visit (or with #intro), drawn live from reel/reel.js
const intro = (() => {
  const el = document.getElementById("intro");
  const canvas = el.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const bar = el.querySelector(".bar");
  const soundBtn = document.getElementById("intro-sound");
  let start = 0, raf = 0, ac = null, soundOn = false, data = null, playing = false;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = innerWidth * dpr, h = innerHeight * dpr;
    const cap = 2560 / Math.max(w, 1);
    if (cap < 1) { w *= cap; h *= cap; }
    canvas.width = Math.round(w); canvas.height = Math.round(h);
  }
  function startSound(offset) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      Reel.buildAudio(ac, ac.currentTime + 0.05, offset + 0.05);
    } catch (e) { ac = null; }
  }
  function stopSound() { if (ac) { ac.close().catch(() => {}); ac = null; } }
  function setSound(on) {
    soundOn = on;
    soundBtn.textContent = on ? "🔇 소리 끄기" : "🔊 소리 켜기";
    stopSound();
    if (on && playing) startSound((performance.now() - start) / 1000);
  }
  function tick(now) {
    const t = (now - start) / 1000;
    Reel.frame(ctx, t, data);
    bar.style.width = Math.min(100, (t / Reel.DURATION) * 100) + "%";
    if (t >= Reel.DURATION) return finish();
    raf = requestAnimationFrame(tick);
  }
  function finish() {
    if (!playing) return;
    playing = false;
    cancelAnimationFrame(raf);
    stopSound();
    el.classList.add("leaving");
    setTimeout(() => { el.hidden = true; el.classList.remove("leaving"); }, 650);
    try { localStorage.setItem("reel-seen", "1"); } catch (e) {}
    if (location.hash === "#intro") history.replaceState(null, "", location.pathname + location.search);
  }
  async function play() {
    if (playing || !window.Reel) return;
    el.hidden = false; el.classList.remove("leaving");
    size();
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    const snaps = await Promise.race([historyPromise, timeout(1500).then(() => [])]);
    data = Reel.dataFrom(snaps && snaps[0]);
    await Reel.loadFonts(2500);
    playing = true;
    start = performance.now();
    if (soundOn) startSound(0);
    raf = requestAnimationFrame(tick);
  }
  soundBtn.onclick = () => setSound(!soundOn);
  document.getElementById("intro-skip").onclick = finish;
  document.getElementById("replay-intro").onclick = () => { setSound(true); play(); };
  addEventListener("keydown", e => { if (e.key === "Escape") finish(); });
  addEventListener("resize", () => { if (playing) size(); });
  return { play };
})();

(() => {
  let seen = false;
  try { seen = localStorage.getItem("reel-seen") === "1"; } catch (e) {}
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (location.hash === "#intro" || (!seen && !reduced)) intro.play();
})();
</script>
</body>
</html>
